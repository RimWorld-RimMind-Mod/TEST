name: Generate Tag Release
run-name: ${{ github.ref_name }}

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
      - 'V[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    uses: RimWorld-RimMind-Mod/Workflows/.github/workflows/release.yml@v1
    with:
      tag-name: ${{ github.ref_name }}
    secrets: inherit
